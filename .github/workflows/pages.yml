# Publishes to GitHub Pages: the Knomi installer at the root (the README's link, and where Knomis
# download Wi-Fi updates from), the Waveshare one under /waveshare/, /play/ pointing to
# Catch 151 for Web's own site (tools/publish_web.sh), the Catch 151 Dex under /sprites/, built from the packs, and the
# soundtrack under /music/ (web/music).
name: Pages

on:
  push:
    branches: [main]
    paths: ['Catch151/web/**', '.github/workflows/pages.yml', 'Catch151/tools/sdcard/mons/**', 'Catch151/tools/dex_data.py',
            'Catch151/tools/make_sprite_gallery.py', 'Catch151/tools/sprite_gallery.html', 'Catch151/tools/voices.json',
            'Catch151/tools/dex.json', 'Catch151/tools/assets/brand/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# everything is in Catch151/: the steps run from there
defaults:
  run:
    working-directory: Catch151

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R web/knomi/. site/
          # the soundtrack page (tools/build_music_page.sh builds its player)
          cp -R web/music site/music
          # the web game lives at its own address only (a second one would keep a second save)
          mkdir -p site/play
          printf '<!doctype html><meta charset="utf-8"><title>Catch 151</title><meta http-equiv="refresh" content="0; url=https://catch151.3dprintsos.com/"><a href="https://catch151.3dprintsos.com/">Catch 151 for Web has moved</a>\n' > site/play/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Catch 151 Dex
        run: |
          pip install pillow
          python3 tools/make_sprite_gallery.py site/sprites
      # (v5 of both: with v3 and v4 the deploy stopped finding the uploaded site, "Found 0 artifact(s)", 2.0.7)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: Catch151/site
      - id: deployment
        uses: actions/deploy-pages@v5
